<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My clips | TakeKash</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d0c;--panel:#131715;--panel2:#1a1f1c;--line:#26302b;--ink:#eef3ef;--mute:#93a39a;--kash:#2fe07c;--kash2:#1fb862;--warn:#f5b83d;--bad:#ff6b6b;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--kash)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.logo{font:700 20px 'Space Grotesk',sans-serif;letter-spacing:-.02em;color:var(--ink);text-decoration:none}.logo b{color:var(--kash)}
.pill{font-size:12px;color:var(--mute);border:1px solid var(--line);padding:4px 10px;border-radius:99px;background:none;cursor:pointer;font-family:inherit}
h1{font:700 clamp(28px,6vw,40px)/1.08 'Space Grotesk',sans-serif;letter-spacing:-.03em;margin:8px 0 10px}h1 em{font-style:normal;color:var(--kash)}
.lede{color:var(--mute);max-width:600px;margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px}
input:focus{outline:2px solid var(--kash);outline-offset:-1px;border-color:transparent}
.btn{display:inline-block;background:var(--kash);color:#04210f;border:0;border-radius:10px;padding:12px 18px;font:700 15px 'Space Grotesk',sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{margin-top:10px;color:var(--mute);min-height:1.5em}.msg.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font:700 26px 'Space Grotesk',sans-serif}.stat span{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--kash)}
.job{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.job + .job{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.src{font-weight:600;word-break:break-all}.meta{color:var(--mute);font-size:13px}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.chip.delivered{color:var(--kash);border-color:var(--kash2)}.chip.processing,.chip.confirming{color:var(--warn);border-color:var(--warn)}
.chip.failed{color:var(--bad);border-color:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.job{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style></head>
<body><div class="wrap">
<header class="top"><a class="logo" href="/">Take<b>Kash</b></a><button class="pill" id="out" hidden>Sign out</button></header>

<section id="signin">
  <h1>Your <em>clips</em>, in one place</h1>
  <p class="lede">Every clip job, its status, your download links and how many clips you have left. Enter the email you used and we'll send a sign-in link.</p>
  <form class="card" id="f">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <div class="row" style="margin-top:12px"><button class="btn" type="submit">Email me a sign-in link</button></div>
    <div class="msg" id="m" role="status"></div>
  </form>
</section>

<section id="dash" hidden>
  <h1>My <em>clips</em></h1>
  <p class="lede" id="who"></p>
  <div class="card">
    <div class="stats">
      <div class="stat"><b id="left">–</b><span>clips left</span></div>
      <div class="stat"><b id="used">–</b><span id="usedl">used</span></div>
      <div class="stat"><b id="plan">–</b><span>plan</span></div>
    </div>
    <div class="bar"><i id="barfill" style="width:0"></i></div>
    <div class="row" style="margin-top:14px"><a class="btn" href="/#clip">Make more clips</a><a class="btn ghost" id="up" href="/#pricing" hidden>Get more clips</a></div>
  </div>
  <div class="card" id="jobs"></div>
</section>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LABEL = { awaiting_confirm: "Waiting for your confirm email", confirming: "Starting", processing: "Making your clips", delivered: "Ready", failed: "Couldn't make clips", manual: "Being made by hand" };
  const when = (d) => d ? new Date(d).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  let token = null;
  const save = (t) => { token = t; try { t ? localStorage.setItem("tk_portal", t) : localStorage.removeItem("tk_portal"); } catch {} };
  try { token = localStorage.getItem("tk_portal"); } catch {}
  const q = new URLSearchParams(location.search).get("t");
  if (q) { save(q); history.replaceState(null, "", "/portal"); }

  async function load() {
    const r = await fetch("/api/portal", { headers: { Authorization: `Bearer ${token}` } });
    if (r.status === 401) { save(null); return show(false, "Your sign-in link expired. Request a new one."); }
    if (!r.ok) return show(false, "Couldn't load your clips. Try again in a minute.");
    render(await r.json()); show(true);
  }
  function show(signedIn, note) {
    $("signin").hidden = signedIn; $("dash").hidden = !signedIn; $("out").hidden = !signedIn;
    if (note) { $("m").textContent = note; $("m").className = "msg bad"; }
  }
  function render(d) {
    const a = d.allowance;
    $("who").textContent = `Signed in as ${d.email}`;
    $("left").textContent = a.left; $("used").textContent = a.used;
    $("usedl").textContent = a.plan === "free" ? `of ${a.limit} free` : `of ${a.limit} this month`;
    $("plan").textContent = a.plan[0].toUpperCase() + a.plan.slice(1);
    $("barfill").style.width = `${Math.min(100, Math.round((a.used / Math.max(1, a.limit)) * 100))}%`;
    $("up").hidden = a.plan === "pro";
    $("jobs").innerHTML = d.jobs.length ? d.jobs.map((j) => `
      <div class="job">
        <div>
          <div class="src">${esc(j.source)} stream</div>
          <div class="meta">Requested ${esc(when(j.requestedAt))}${j.finishedAt ? ` · finished ${esc(when(j.finishedAt))}` : ""}${j.clips ? ` · ${j.delivered || 0}/${j.clips} clips` : ""}</div>
          ${j.download ? `<div class="meta">Link works until ${esc(when(j.downloadExpires))}</div>` : ""}
        </div>
        <div class="row">
          <span class="chip ${esc(j.status)}">${esc(LABEL[j.status] || j.status)}</span>
          ${j.download ? `<a class="btn" href="${esc(j.download)}" rel="noopener">Download</a>` : ""}
        </div>
      </div>`).join("") : `<div class="empty">No clip jobs yet. Paste a stream link on the homepage to make your first clips.</div>`;
  }

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("m"); m.className = "msg"; m.textContent = "Sending…";
    try {
      const r = await fetch("/api/portal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value }) });
      const b = await r.json(); m.textContent = b.message || b.error; if (!r.ok) m.className = "msg bad";
    } catch { m.className = "msg bad"; m.textContent = "Network error. Try again."; }
  });
  $("out").addEventListener("click", () => { save(null); show(false); });
  if (token) load(); else show(false);
  if (token) setInterval(() => { if (!document.hidden) load(); }, 30000);   // live status while a job runs
})();
</script>
</body></html>
